name: iOS Unsigned IPA

# Builds an UNSIGNED iOS .ipa on a GitHub macOS runner.
# No Apple Developer account or signing required.
# Download the .ipa from the workflow's Artifacts, then load it with your sideload tool.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        run: |
          set -o pipefail
          if ! command -v pod >/dev/null 2>&1; then
            echo "pod not on runner image — installing via Homebrew"
            brew install cocoapods
          fi
          cd ios
          pod install --repo-update 2>&1 | tee "$GITHUB_WORKSPACE/pod-install.log"

      - name: Detect workspace and scheme
        id: detect
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace 2>/dev/null | head -1)
          if [ -z "$WS" ]; then WS=$(ls -d *.xcodeproj 2>/dev/null | head -1); fi
          SCHEME=$(xcodebuild -list -workspace "$WS" 2>/dev/null | sed -n '/Schemes:/,$p' | tail -n +2 | head -1 | xargs)
          if [ -z "$SCHEME" ]; then SCHEME="${WS%%.*}"; fi
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Detected workspace=$WS scheme=$SCHEME"

      - name: Compile (code signing disabled)
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package unsigned .ipa
        run: |
          cd ios
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "No .app produced"; exit 1; fi
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qry DapperPOS-unsigned.ipa Payload
          echo "Packaged $(pwd)/DapperPOS-unsigned.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: DapperPOS-unsigned-ipa
          path: mobile/ios/DapperPOS-unsigned.ipa
          if-no-files-found: error

      - name: Attach .ipa to GitHub Release (on success)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-v${{ github.run_number }}
          name: "Unsigned IPA — run ${{ github.run_number }}"
          body: "Unsigned iOS build of commit ${{ github.sha }} — install via Sideloadly/AltStore or any signing tool."
          files: mobile/ios/DapperPOS-unsigned.ipa
          fail_on_unmatched_files: true

      - name: Push debug log to ci-logs branch (on failure)
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f pod-install.log ] || [ -f xcodebuild.log ]; then
            git config user.email "ci@local"
            git config user.name "ci-logger"
            git checkout -B ci-logs
            mkdir -p logs
            [ -f pod-install.log ] && cp pod-install.log "logs/run-${GITHUB_RUN_NUMBER}-pod.log"
            [ -f xcodebuild.log ] && cp xcodebuild.log "logs/run-${GITHUB_RUN_NUMBER}-xcodebuild.log"
            git add logs
            git commit -m "ci logs: run ${GITHUB_RUN_NUMBER}"
            git push origin ci-logs --force
          fi
