name: iOS Unsigned IPA

# Builds an UNSIGNED iOS .ipa on a GitHub macOS runner.
# No Apple Developer account or signing required.
# Download the .ipa from the workflow's Artifacts, then load it with your sideload tool.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Detect workspace and scheme
        id: detect
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace 2>/dev/null | head -1)
          if [ -z "$WS" ]; then WS=$(ls -d *.xcodeproj 2>/dev/null | head -1); fi
          SCHEME=$(xcodebuild -list -workspace "$WS" 2>/dev/null | sed -n '/Schemes:/,$p' | tail -n +2 | head -1 | xargs)
          if [ -z "$SCHEME" ]; then SCHEME="${WS%%.*}"; fi
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Detected workspace=$WS scheme=$SCHEME"

      - name: Compile (code signing disabled)
        run: |
          cd ios
          xcodebuild \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          cd ios
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "No .app produced"; exit 1; fi
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qry DapperPOS-unsigned.ipa Payload
          echo "Packaged $(pwd)/DapperPOS-unsigned.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: DapperPOS-unsigned-ipa
          path: mobile/ios/DapperPOS-unsigned.ipa
          if-no-files-found: error
