name: Android APK

# Builds a release Android .apk on a GitHub runner (JDK 17 + Android SDK are
# preinstalled). The release build type signs with the debug keystore, so the
# resulting APK installs directly on a device / emulator for testing.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci

      - name: Ensure native android project is current
        run: npx expo prebuild --platform android

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DapperPOS-android-apk
          path: mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
